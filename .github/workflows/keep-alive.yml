name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes during market hours (UTC: 4am-9pm IST: 9:30am-2:30am)
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_API_URL secret not set, skipping"
            exit 0
          fi
          echo "Pinging ${RENDER_URL}/api/health ..."
          HTTP_CODE=$(curl -s -S -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            "${RENDER_URL}/api/health") || true
          echo "Response code: ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Server is healthy"
          else
            echo "⚠ Server returned ${HTTP_CODE} (may be starting up)"
          fi
