<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2538"/>
      <stop offset="50%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ec27e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2ec27e" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="40%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#2ec27e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Card -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle / HIG Canvas) -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="#303b54" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Sub-grid Background Lines -->
  <line x1="20" y1="40" x2="108" y2="40" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="3,3"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="3,3"/>
  <line x1="20" y1="88" x2="108" y2="88" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="3,3"/>

  <!-- Candlesticks in background -->
  <!-- Candle 1 (Down - Red) -->
  <line x1="32" y1="60" x2="32" y2="86" stroke="#e01b24" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="29.5" y="66" width="5" height="14" rx="1" fill="#e01b24" fill-opacity="0.6"/>

  <!-- Candle 2 (Up - Green) -->
  <line x1="52" y1="46" x2="52" y2="78" stroke="#2ec27e" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="49.5" y="52" width="5" height="18" rx="1" fill="#2ec27e" fill-opacity="0.6"/>

  <!-- Candle 3 (Up - Green) -->
  <line x1="72" y1="36" x2="72" y2="68" stroke="#2ec27e" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="69.5" y="40" width="5" height="20" rx="1" fill="#2ec27e" fill-opacity="0.6"/>

  <!-- Area chart fill under line -->
  <path d="M 20 84 Q 38 80, 50 62 T 80 50 T 108 30 L 108 94 L 20 94 Z" fill="url(#chartFill)" />

  <!-- Main Trend Line -->
  <path d="M 20 84 Q 38 80, 50 62 T 80 50 T 108 30" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Glowing Peak Marker Dot -->
  <circle cx="108" cy="30" r="7" fill="#2ec27e" fill-opacity="0.3"/>
  <circle cx="108" cy="30" r="4.5" fill="#2ec27e"/>
  <circle cx="108" cy="30" r="2" fill="#ffffff"/>
</svg>
